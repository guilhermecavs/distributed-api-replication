# nginx/nginx.conf
# Nginx como gateway e balanceador de carga com failover automático.
#
# Fluxo normal:    Cliente → Nginx → Primário (8080)
# Após falha:      Cliente → Nginx → Backup   (8081)
#
# Failover passivo: quando o primário responde 503 ou não responde, o Nginx
# reencaminha a requisição para o backup (proxy_next_upstream). Após 3 falhas
# em 10s o primário é marcado como indisponível (max_fails/fail_timeout).

events {
    worker_connections 1024;
}

http {

    # Logs com identificação do upstream usado (log_format só é permitido no bloco http)
    log_format upstream_log '$remote_addr → $upstream_addr [$status] "$request"';

    # ── Upstream: define o pool de servidores backend ──────────────────────────
    upstream api_backend {
        # Política: primeiro servidor disponível (com failover)
        # O Nginx tenta o primário; se falhar, tenta o backup.

        server primario:8080 max_fails=3 fail_timeout=10s;
        server backup:8081   max_fails=3 fail_timeout=10s backup;
        #                                                   ↑
        #  "backup" = só recebe tráfego quando o primário estiver indisponível
    }

    # ── Servidor principal ─────────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        access_log /var/log/nginx/access.log upstream_log;

        # ── Rota principal: proxy para o backend ────────────────────────────
        location / {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;

            # Headers de diagnóstico (o cliente vê qual nó respondeu)
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            add_header         X-Upstream-Node   $upstream_addr always;

            # Timeouts: deve ser maior que TIMEOUT_REPLICACAO (3s) em sync.rs
            proxy_connect_timeout 5s;
            proxy_send_timeout    10s;
            proxy_read_timeout    10s;

            # Tenta o próximo servidor em caso de erro de conexão, timeout ou 503.
            # non_idempotent permite reenviar POSTs: o nó em falha recusa a requisição
            # antes de processá-la. Trade-off: num timeout real, um POST já gravado
            # no primário poderia ser repetido no backup.
            proxy_next_upstream error timeout http_503 non_idempotent;
        }

        # ── Health check do próprio Nginx ───────────────────────────────────
        location /nginx-status {
            stub_status on;
            allow 127.0.0.1;
            deny  all;
        }
    }
}
